<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="30 Days of React Native Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="55%" stop-color="#13223D" />
      <stop offset="100%" stop-color="#0E3A5D" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)" />

  <!-- Subtle grid dots -->
  <g fill="#61DAFB" opacity="0.12">
    <circle cx="960" cy="64" r="3" />
    <circle cx="990" cy="64" r="3" />
    <circle cx="1020" cy="64" r="3" />
    <circle cx="1050" cy="64" r="3" />
    <circle cx="960" cy="94" r="3" />
    <circle cx="990" cy="94" r="3" />
    <circle cx="1020" cy="94" r="3" />
    <circle cx="1050" cy="94" r="3" />
    <circle cx="960" cy="124" r="3" />
    <circle cx="990" cy="124" r="3" />
    <circle cx="1020" cy="124" r="3" />
    <circle cx="1050" cy="124" r="3" />
  </g>

  <!-- React Atom Icon -->
  <g transform="translate(150, 160)">
    <circle cx="0" cy="0" r="16" fill="#61DAFB" />
    <ellipse cx="0" cy="0" rx="76" ry="29" fill="none" stroke="#61DAFB" stroke-width="5" />
    <ellipse cx="0" cy="0" rx="76" ry="29" fill="none" stroke="#61DAFB" stroke-width="5" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="76" ry="29" fill="none" stroke="#61DAFB" stroke-width="5" transform="rotate(120)" />
  </g>

  <!-- Title and Subtitle -->
  <text x="270" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    30 Days of React Native
  </text>
  <text x="270" y="186" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
    Modern mobile development with React Native 0.88, Expo SDK 58 &amp; TypeScript
  </text>

  <!-- Feature Pills -->
  <g transform="translate(270, 214)">
    <rect x="0" y="0" width="146" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="73" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E0F2FE">30 Daily Lessons</text>

    <rect x="162" y="0" width="146" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="235" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E0F2FE">5 Real Projects</text>

    <rect x="324" y="0" width="150" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="399" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E0F2FE">TypeScript First</text>

    <rect x="490" y="0" width="148" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="564" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E0F2FE">Expo Router</text>
  </g>
</svg>
